# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

parameters:
    stripe.public_key: '%env(STRIPE_PUBLISHABLE_KEY)%'
    recaptcha.secret: '%env(default::RECAPTCHA_SECRET_KEY)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    App\:
        resource: '../src/'

    App\Service\OrderMailer:
        arguments:
            $mailerFrom: '%env(MAILER_FROM)%'

    App\Service\StripePaymentService:
        arguments:
            $secretKey: '%env(STRIPE_SECRET_KEY)%'
            $publishableKey: '%env(default::STRIPE_PUBLISHABLE_KEY)%'
            $webhookSecret: '%env(default::STRIPE_WEBHOOK_SECRET)%'
            $defaultBaseUrl: '%env(DEFAULT_URI)%'

    App\Image\ImageUploader:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\EmailVerificationService:
        arguments:
            $mailerFrom: '%env(MAILER_FROM)%'

    App\Service\RecaptchaValidator:
        arguments:
            $recaptchaSecret: '%recaptcha.secret%'

    App\Security\TwoFactor\ExpiringEmailCodeGenerator:
        arguments:
            $digits: '%scheb_two_factor.email.digits%'
            $ttlSeconds: 300

    Scheb\TwoFactorBundle\Mailer\AuthCodeMailerInterface:
        alias: 'scheb_two_factor.security.email.symfony_auth_code_mailer'

    App\Security\TwoFactor\RoleBasedTrustedDeviceCondition:
        arguments:
            $trustedDeviceManager: '@scheb_two_factor.trusted_device_manager'
            $extendTrustedToken: '%scheb_two_factor.trusted_device.extend_lifetime%'

    scheb_two_factor.trusted_device_condition:
        alias: App\Security\TwoFactor\RoleBasedTrustedDeviceCondition

    # Rate Limiters
    password_reset.rate_limiter:
        class: Symfony\Component\RateLimiter\RateLimiterFactory
        arguments:
            - key: 'password_reset_%s'
              policy: 'sliding_window'
              limit: 3
              interval: '15 minutes'

    registration.rate_limiter:
        class: Symfony\Component\RateLimiter\RateLimiterFactory
        arguments:
            - key: 'registration_%s'
              policy: 'sliding_window'
              limit: 5
              interval: '24 hours'

    App\Controller\Api\PasswordResetController:
        arguments:
            $passwordResetLimiter: '@password_reset.rate_limiter'
            $mailerFrom: '%env(MAILER_FROM)%'

    App\Controller\Api\RegistrationController:
        arguments:
            $registrationLimiter: '@registration.rate_limiter'
