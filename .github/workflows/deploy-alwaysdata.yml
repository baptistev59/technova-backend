name: Deploy TechNova backend to AlwaysData

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync sources to Alwaysdata (rsync)
        uses: burnett01/rsync-deployments@7.1.0
        with:
          switches: -az --delete --exclude=".git" --exclude=".github" --exclude="var/" --exclude="vendor/" --exclude=".env.local" --exclude=".env.local.php" --exclude="public/assets"
          path: ./
          remote_path: ${{ secrets.DEPLOY_PATH }}
          remote_host: ${{ secrets.SSH_REMOTE_HOST }}
          remote_user: ${{ secrets.SSH_REMOTE_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}
          remote_port: ${{ secrets.SSH_REMOTE_PORT }}

      - name: Install & migrate on Alwaysdata
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_REMOTE_HOST }}
          username: ${{ secrets.SSH_REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_REMOTE_PORT }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            # Charger les variables d’environnement côté serveur (CLI)
            # Ce fichier est privé et n’est pas versionné.
            ENV_FILE="$HOME/.env.deploy"
            if [ ! -f "$ENV_FILE" ]; then
              echo "❌ Fichier d'environnement introuvable: $ENV_FILE"
              echo "Créez-le sur le serveur avec APP_ENV, APP_DEBUG, DATABASE_URL, JWT_*, etc."
              exit 1
            fi
            set -a
            . "$ENV_FILE"
            set +a

            # Forcer l'environnement prod pour la CLI
            export APP_ENV=prod
            export APP_DEBUG=0
            
            # Sur AlwaysData : APP_ENV doit être prod pour que composer install
            # évite DebugBundle (inexistant en --no-dev).
            # Les variables seront lues depuis l'interface AlwaysData en PHP-FPM runtime.
            
            # Installer les dépendances
            APP_ENV=prod composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
            
            # Exécuter les migrations
            APP_ENV=prod php bin/console doctrine:migrations:migrate --no-interaction --env=prod
            
            # Vider et régénérer le cache
            rm -rf var/cache/prod
            APP_ENV=prod php bin/console cache:clear --env=prod --no-warmup
            APP_ENV=prod php bin/console cache:warmup --env=prod --no-debug
            
            # Compiler les assets
            APP_ENV=prod php bin/console asset-map:compile --env=prod
            
            echo "✅ Déploiement réussi"
